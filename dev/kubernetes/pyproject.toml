[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otel-instr-dagster-k8s-e2e"
version = "0.0.0"
description = "Real-cluster k8s_job_executor verification for opentelemetry-instrumentation-dagster -- see this directory's own README.md, not published anywhere"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-instrumentation-dagster",
    # Pinned to the exact dagster patch version this whole workspace resolves to
    # (dagster-dbt==0.29.22 in the root pyproject.toml pins the same way, same
    # reasoning: dagster-postgres/dagster-k8s release lockstep with dagster itself).
    "dagster-postgres==0.29.22",
    "dagster-k8s==0.29.22",
]

[tool.uv.sources]
opentelemetry-instrumentation-dagster = { workspace = true }

[tool.hatch.build.targets.wheel]
# No real importable code of its own, just a dependency declaration -- points at
# workspace/ (the actual op graph + run config this directory ships) purely to give
# hatchling *something* to build a (otherwise-empty-of-meaning) wheel from.
packages = ["workspace"]

