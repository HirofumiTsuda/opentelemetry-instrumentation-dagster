apiVersion: v1
kind: Pod
metadata:
  name: dagster-runner
spec:
  serviceAccountName: dagster-runner
  restartPolicy: Never
  containers:
    - name: runner
      image: otel-instr-dagster-k8s-e2e:latest
      imagePullPolicy: Never
      # No `opentelemetry-instrument` prefix here -- deliberately. The image's own
      # baked PYTHONPATH (see ../Dockerfile) already covers this process too, same
      # as every step pod's internal command. Running the plain command here is
      # itself part of what's being verified: that the static approach needs no
      # per-command wrapping anywhere.
      command:
        - dagster
        - job
        - execute
        - -f
        - /workspace/k8s_e2e_job.py
        - -j
        - k8s_e2e_job
        - --config
        - /workspace/run_config.yaml
