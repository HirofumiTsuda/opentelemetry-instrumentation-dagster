execution:
  config:
    job_namespace: default
    job_image: "otel-instr-dagster-k8s-e2e:latest"
    service_account_name: dagster-runner
    env_vars:
      - "OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317"
      - "OTEL_SERVICE_NAME=k8s_e2e_test"
    # Deliberately NOT forwarding PYTHONPATH here -- it doesn't need to be, since
    # it's already baked into the image itself (../Dockerfile). This env_vars list
    # is an explicit allowlist forwarded from the launching process into each step
    # pod (checked dagster_k8s/executor.py -- see README.md's k8s_job_executor
    # section), which is exactly the propagation path PYTHONPATH can't ride on here
    # (no parent-process env inheritance between pods at all); baking it into the
    # image instead sidesteps needing this list to carry it.
    #
    # fs_io_manager (the default) writes op outputs to local disk -- each step pod
    # is a fresh container with no shared filesystem of its own, so a downstream
    # step's pod can't see an upstream step's pod's output without one. A single
    # shared PVC works here because the kind cluster is single-node (ReadWriteOnce
    # is enough, since every pod lands on the same node) -- unrelated to trace
    # propagation itself (that goes through postgres via run tags, not this), just
    # a prerequisite for the job to run to completion at all under
    # k8s_job_executor.
    volumes:
      - name: dagster-storage
        persistentVolumeClaim:
          claimName: dagster-storage
    volume_mounts:
      - name: dagster-storage
        mount_path: /dagster-home/storage
