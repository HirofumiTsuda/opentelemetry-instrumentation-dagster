[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation-dagster"
dynamic = ["version"]
description = "Auto-instrumentation for Dagster ops/assets, no @traced() decorator required -- the opt-in companion to dagster-otel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hirofumi Tsuda" },
]
keywords = [
    "dagster",
    "opentelemetry",
    "otel",
    "tracing",
    "observability",
    "auto-instrumentation",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # dagster-otel does the actual span creation (@traced()) -- this package's only
    # job is to apply that decorator to the user's ops/assets automatically, by
    # patching dagster.asset/op/etc. before the user's Definitions module imports
    # them. See README.md for why this is a separate package, not folded into
    # dagster-otel itself.
    "dagster-otel",
    "dagster >= 1.5",
    "opentelemetry-instrumentation",
    # Comes in transitively via opentelemetry-instrumentation, but the decorator-
    # wrapping code imports it directly (wrapt.wrap_function_wrapper), so it's
    # declared explicitly rather than relying on someone else's dependency graph.
    "wrapt",
]

[dependency-groups]
test = [
    "pytest >= 7",
]
# Only needed to verify dbt_assets rides along on the multi_asset patch (see
# tests/test_dbt_assets.py) -- not running real dbt, so dbt-duckdb etc. aren't
# needed, just the dbt_assets decorator itself. Version matches dagster-otel's own
# pin against the same dagster version this project also targets.
dbt = [
    "dagster-dbt==0.29.23",
]
lint = [
    "mypy==2.3.1",
    "pyright==1.1.414",
]

[project.entry-points.opentelemetry_instrumentor]
# Registers this package with opentelemetry-instrument's auto-discovery -- the entry
# point group name (not the key) is what opentelemetry-instrument looks for; matches
# every other opentelemetry-instrumentation-* package's convention.
dagster = "opentelemetry.instrumentation.dagster:DagsterInstrumentor"

[project.urls]
Home = "https://github.com/HirofumiTsuda/opentelemetry-instrumentation-dagster"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/dagster/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.uv.workspace]
# dev/kubernetes is its own small package (dagster-postgres/dagster-k8s, only
# needed for the real-cluster k8s_job_executor verification, dev/kubernetes/
# README.md) -- a workspace member instead of ad-hoc `uv pip install`s bolted onto
# its Dockerfile, so those dependencies are declared and locked the same way as
# everything else, sharing this root uv.lock rather than needing one of its own.
members = ["dev/kubernetes"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
# Implicit namespace packages (opentelemetry/instrumentation/dagster has no
# __init__.py anywhere above it, matching the whole opentelemetry-instrumentation-*
# ecosystem's own layout) confuse mypy's default module-root inference when checking
# src/ and tests/ together -- it was resolving src/opentelemetry/instrumentation/
# dagster/__init__.py as both "dagster" and "opentelemetry.instrumentation.dagster"
# simultaneously ("Source file found twice under different module names"). These two
# settings are mypy's own documented fix for exactly this src-layout + namespace-
# package combination.
explicit_package_bases = true
mypy_path = "src"
