name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      # dbt group: tests/test_dbt_assets.py imports dagster_dbt (verifying dbt_assets
      # shares the patched multi_asset, not running real dbt -- see that file's own
      # docstring for why dbt-duckdb etc. aren't needed here).
      - run: uv sync --group test --group dbt

      - run: uv run pytest

  # Runs the same suite against the declared Dagster floor's newest patch, so the
  # floor can't silently drift from reality (dagster-otel#86 is how that happened
  # there). dagster-dbt is left unpinned so the resolver picks the release matching
  # dagster 1.10 (it pins dagster 1:1). Plain venv + `uv pip`, not `uv sync`: the
  # lockfile pins the latest Dagster.
  test-dagster-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv venv --python 3.10 .venv-floor
      - run: VIRTUAL_ENV=.venv-floor uv pip install -e . "dagster==1.10.*" dagster-dbt "pytest>=7"
      - run: .venv-floor/bin/python -c "import dagster, dagster_dbt; print(dagster.__version__, dagster_dbt.__version__)"
      - run: .venv-floor/bin/python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uvx ruff@0.16.7 check .
      - run: uvx ruff@0.16.7 format --check .

      # All three groups, not just lint: mypy/pyright checking tests/ needs pytest
      # and dagster_dbt importable too, same reasoning as the test job above.
      - run: uv sync --group lint --group test --group dbt

      - run: uv run mypy src/ tests/
      - run: uv run pyright src tests
