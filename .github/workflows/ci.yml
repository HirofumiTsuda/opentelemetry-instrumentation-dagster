name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - run: uv sync --group test

      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - run: uvx ruff@0.16.7 check .
      - run: uvx ruff@0.16.7 format --check .

      # Both groups, not just lint: mypy checking tests/ needs pytest importable too
      # (conftest.py does `import pytest`), same reasoning as dagster-otel's own CI.
      - run: uv sync --group lint --group test

      - run: uv run mypy src/ tests/
      - run: uv run pyright src tests
