services:
  # Just enough to see the quickstart work -- a real OTLP backend with a UI.
  # See README.md's Quick Start section.
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP gRPC -- point OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # UI -- http://localhost:16686
